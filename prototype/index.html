// ─────────────────────────────────────────────────────────────────────────────
// EDGE PATH MATH
// ─────────────────────────────────────────────────────────────────────────────
function edgePath(from, to, kind) {
  const sx = from.x + from.w, sy = from.y + 60;
  const tx = to.x,             ty = to.y  + 60;
  const dx = Math.max(40, Math.abs(tx - sx) * 0.45);
  if (kind === 'feedback') {
    const midY = Math.max(from.y, to.y) + 220;
    return `M ${sx} ${sy+60} C ${sx+80} ${midY}, ${tx-80} ${midY}, ${tx} ${ty+60}`;
  }
  return `M ${sx} ${sy} C ${sx+dx} ${sy}, ${tx-dx} ${ty}, ${tx} ${ty}`;
}

  width:'100%', background:T.bg, border:`1px solid ${T.border}`,
  borderRadius:4, padding:'6px 8px', color:T.text, fontSize:12,
  fontFamily:SANS, outline:'none',
};
const Btn = ({children, primary, small, onClick, style={}}) => (
  <button onClick={onClick} style={{
    height:small?24:28, padding:small?'0 10px':'0 14px', border:'none', borderRadius:5,
    background: primary ? T.accent : T.surface3,
    color: primary ? '#1a1207' : T.text,
    fontSize:12, fontWeight: primary?600:500, cursor:'pointer',

    ...style,
  }}>{children}</button>
);

// ─────────────────────────────────────────────────────────────────────────────
// FILE TREE
// ─────────────────────────────────────────────────────────────────────────────
function FileTree() {
  const [open, setOpen] = React.useState({'.harness':true,'trajectories':true});
  const render = (e, depth=0) => {
    if (e.type === 'dir') {
      const isOpen = open[e.name];
      return (
        <div key={e.name}>
          <div onClick={()=>setOpen(s=>({...s,[e.name]:!isOpen}))}
            style={{display:'flex',alignItems:'center',gap:4,
              padding:`3px 0 3px ${8+depth*12}px`,cursor:'pointer',
              color:T.muted,fontSize:12,userSelect:'none'}}>
            <span style={{width:10,display:'inline-flex',opacity:.6}}>
              <Icon name={isOpen?'chev-d':'chev'} size={10}/>
            </span>
            <Icon name="folder" size={12} color={T.accent} style={{opacity:.75}}/>
            <span>{e.name}</span>
          </div>
          {isOpen && e.children?.map(c=>render(c,depth+1))}
        </div>
      );
    }
    return (
      <div key={e.name} style={{
        display:'flex',alignItems:'center',gap:6,
        padding:`3px 0 3px ${8+depth*12+14}px`,
        color: e.active?T.text : e.muted?T.hint : T.muted,
        background: e.active?T.accentSoft:'transparent',
        borderLeft: e.active?`2px solid ${T.accent}`:'2px solid transparent',
        fontSize:12, cursor:'pointer',
      }}>
        <Icon name="file" size={11} style={{opacity:.5}}/>
        <span>{e.name}</span>
      </div>
    );
  };
  return (
    <div style={{flex:1,overflow:'auto',padding:'6px 0'}}>
      {WORKSPACE_FILES.map(e=>render(e))}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// CANVAS NODE
// ─────────────────────────────────────────────────────────────────────────────
function CanvasNode({node, pos, selected, dragging, onSelect, onPointerDown}) {
  const meta   = ROLE_META[node.kind];
  const status = STATUS[node.status] || STATUS.idle;
  const model  = node.model ? MODELS[node.model] : null;
  const pct    = node.tokens.budget ? node.tokens.used / node.tokens.budget : 0;

  return (
    <div onPointerDown={onPointerDown} onClick={onSelect}
      style={{
        position:'absolute', left:pos.x, top:pos.y, width:node.w,
        background:T.surface2,
        border:`1px solid ${selected ? T.accent : T.border}`,
        borderRadius:8,
        boxShadow: selected
          ? `0 0 0 3px ${T.accentSoft}, 0 12px 32px rgba(0,0,0,0.5)`
          : '0 6px 18px rgba(0,0,0,0.35)',
        cursor: dragging ? 'grabbing' : 'grab',
        transition: dragging ? 'none' : 'border-color 120ms, box-shadow 120ms',
        userSelect:'none',
      }}>
      {/* Ports */}
      <div style={{position:'absolute',left:-5,top:54,width:10,height:10,borderRadius:'50%',
        background:T.bg,border:`2px solid ${meta.tint}`,zIndex:1}}/>
      <div style={{position:'absolute',right:-5,top:54,width:10,height:10,borderRadius:'50%',
        background:T.bg,border:`2px solid ${meta.tint}`,zIndex:1}}/>

      {/* Header */}
      <div style={{display:'flex',alignItems:'center',gap:8,
        padding:'10px 12px 8px',borderBottom:`1px solid ${T.border}`}}>
        <div style={{width:22,height:22,borderRadius:5,background:`${meta.tint}22`,
          color:meta.tint,display:'grid',placeItems:'center',flexShrink:0}}>
          <Icon name={meta.icon} size={12}/>
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:13,fontWeight:600,color:T.text,
            overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{node.label}</div>
          <div style={{fontSize:10,color:T.hint,fontFamily:MONO,
            letterSpacing:'0.04em',textTransform:'uppercase'}}>{meta.label}</div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:4,fontSize:10,color:status.dot,flexShrink:0}}>
          <span style={{width:6,height:6,borderRadius:'50%',background:status.dot,
            boxShadow: node.status==='running' ? `0 0 8px ${status.dot}` : 'none',
            animation: node.status==='running' ? 'pulse-dot 1.4s infinite' : 'none'}}/>
          {status.label}
        </div>
      </div>

      {/* Prompt preview */}
      <div style={{padding:'8px 12px 6px',fontSize:11,lineHeight:1.45,color:T.muted,
        fontFamily:MONO,overflow:'hidden',
        display:'-webkit-box',WebkitLineClamp:3,WebkitBoxOrient:'vertical',
        height:50}}>
        {node.prompt}
      </div>

      {/* Footer: model + tools */}
      <div style={{padding:'6px 12px 8px',display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
        {model
          ? <div style={{fontSize:10,color:T.muted,display:'inline-flex',alignItems:'center',gap:3,fontFamily:MONO}}>
              <Icon name="cpu" size={10}/> {model.short}
            </div>
          : <div style={{fontSize:10,color:T.hint,fontFamily:MONO}}>no model</div>
        }
        <div style={{flex:1}}/>
        <div style={{display:'flex',gap:3,flexWrap:'wrap',justifyContent:'flex-end'}}>
          {node.tools.slice(0,3).map((t,i)=>(
            <span key={i} style={{fontSize:9,padding:'2px 5px',borderRadius:3,
              background:T.surface3,color:T.muted,fontFamily:MONO}}>{t}</span>
          ))}
          {node.tools.length>3 && (
            <span style={{fontSize:9,padding:'2px 5px',borderRadius:3,
              background:T.surface3,color:T.hint}}>+{node.tools.length-3}</span>
          )}
        </div>
      </div>

      {/* Token bar */}
      {node.tokens.budget > 0 && (
        <div style={{padding:'0 12px 8px',display:'flex',alignItems:'center',gap:6}}>
          <div style={{flex:1,height:3,background:T.surface3,borderRadius:2,overflow:'hidden'}}>
            <div style={{height:'100%',width:`${Math.min(100,pct*100)}%`,
              background: pct>0.8?T.red : pct>0.5?T.accent : T.green,
              transition:'width 300ms'}}/>
          </div>
          <span style={{fontSize:9,color:T.hint,fontFamily:MONO,minWidth:68,textAlign:'right'}}>
            {(node.tokens.used/1000).toFixed(1)}k / {(node.tokens.budget/1000)}k
          </span>
        </div>
      )}

      {/* Hook chips */}
      {node.hooks.length > 0 && (
        <div style={{padding:'0 10px 10px',display:'flex',gap:4,flexWrap:'wrap'}}>
          {node.hooks.map((h,i)=>(
            <span key={i} style={{fontSize:9,padding:'2px 6px 2px 4px',borderRadius:99,
              background:'rgba(217,119,87,0.12)',color:T.orange,
              display:'inline-flex',alignItems:'center',gap:3,fontFamily:MONO}}>
              <Icon name="shield" size={9}/>{h}
            </span>
          ))}
        </div>
      )}

      {/* Condition badge (gateway) */}
      {node.condition && (
        <div style={{padding:'0 10px 10px'}}>
          <span style={{fontSize:9,padding:'2px 6px',borderRadius:3,
            background:`${T.blue}18`,color:T.blue,fontFamily:MONO}}>
            if {node.condition}
          </span>
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// CANVAS
// ─────────────────────────────────────────────────────────────────────────────
function Canvas({workflow, selected, onSelect}) {
  const [positions, setPositions] = React.useState(
    ()=>Object.fromEntries(workflow.nodes.map(n=>[n.id,{x:n.x,y:n.y}])));
  const [drag, setDrag] = React.useState(null);

  React.useEffect(()=>{
    setPositions(Object.fromEntries(workflow.nodes.map(n=>[n.id,{x:n.x,y:n.y}])));
  },[workflow.id]);

  const onPointerDown = (e, id) => {
    e.stopPropagation(); onSelect(id);
    const sx=e.clientX, sy=e.clientY, start=positions[id];
    const onMove = ev => {
      setDrag(id);
      setPositions(p=>({...p,[id]:{x:start.x+(ev.clientX-sx),y:start.y+(ev.clientY-sy)}}));
    };
    const onUp = () => { setDrag(null); window.removeEventListener('pointermove',onMove); window.removeEventListener('pointerup',onUp); };
    window.addEventListener('pointermove',onMove);
    window.addEventListener('pointerup',onUp);
  };

  const nodeMap = Object.fromEntries(workflow.nodes.map(n=>[n.id,n]));
  const xs = workflow.nodes.map(n=>positions[n.id].x);
  const ys = workflow.nodes.map(n=>positions[n.id].y);
  const minX = Math.min(...xs)-60, minY = Math.min(...ys)-60;
  const maxX = Math.max(...xs.map((x,i)=>x+workflow.nodes[i].w))+80;
  const maxY = Math.max(...ys)+300;

  return (
    <div style={{flex:1,overflow:'auto',position:'relative',
      background:`radial-gradient(circle at 1px 1px, rgba(255,255,255,0.04) 1px, transparent 1px) ${T.bg}`,
      backgroundSize:'20px 20px'}}>

      {/* Canvas toolbar */}
      <div style={{position:'absolute',top:12,left:12,zIndex:10,
        display:'flex',gap:3,background:'rgba(28,31,38,0.92)',
        border:`1px solid ${T.border}`,borderRadius:7,padding:3,backdropFilter:'blur(8px)'}}>
        {Object.entries(ROLE_META).slice(0,6).map(([kind,m])=>(
          <button key={kind} title={`Add ${m.label}`} style={{
            width:28,height:26,border:'none',borderRadius:4,background:'transparent',
            color:T.muted,cursor:'pointer',display:'grid',placeItems:'center',
            transition:'background 100ms',
          }}
          onMouseEnter={e=>e.currentTarget.style.background=T.surface3}
          onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
            <Icon name={m.icon} size={13}/>
          </button>
        ))}
        <div style={{width:1,background:T.border,margin:'2px 2px'}}/>
        <button title="⌘K" style={{
          padding:'0 8px',height:26,border:'none',borderRadius:4,background:'transparent',
          color:T.muted,cursor:'pointer',fontSize:11,fontFamily:MONO,
        }}>⌘K</button>
      </div>

      {/* Minimap */}
      <div style={{position:'absolute',right:14,bottom:14,zIndex:10,
        width:160,height:100,background:'rgba(15,16,20,0.88)',
        border:`1px solid ${T.border}`,borderRadius:6,overflow:'hidden',backdropFilter:'blur(8px)'}}>
        <div style={{position:'absolute',top:4,left:7,fontSize:9,color:T.hint,
          fontFamily:MONO,textTransform:'uppercase',letterSpacing:'0.06em'}}>MAP</div>
        {workflow.nodes.map(n=>{
          const meta=ROLE_META[n.kind]; const p=positions[n.id];
          const sx=(maxX-minX), sy=(maxY-minY);
          return <div key={n.id} style={{
            position:'absolute',
            left:`${((p.x-minX)/sx)*100}%`, top:`${((p.y-minY)/sy)*90}%`,
            width:`${(n.w/sx)*100}%`, height:'8%',
            background:meta.tint,borderRadius:1,
            opacity: selected===n.id ? 1 : 0.55,
            boxShadow: selected===n.id ? `0 0 0 1px ${T.accent}` : 'none',
          }}/>;
        })}
      </div>

      {/* Main scrollable area */}
      <div style={{position:'relative',width:maxX-minX+80,height:maxY-minY+80,
        transform:`translate(${-minX+40}px,${-minY+40}px)`}}>

        <svg style={{position:'absolute',inset:0,width:'100%',height:'100%',
          pointerEvents:'none',overflow:'visible'}}>
          <defs>
            <marker id="arr"   viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0L10 5L0 10z" fill="rgba(255,255,255,0.3)"/>
            </marker>
            <marker id="arr-fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0L10 5L0 10z" fill={T.red}/>
            </marker>
            <marker id="arr-sel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0L10 5L0 10z" fill={T.accent}/>
            </marker>
          </defs>
          {workflow.edges.map((e,i)=>{
            const fn=nodeMap[e.from], tn=nodeMap[e.to];
            if(!fn||!tn) return null;
            const fromR={x:positions[e.from].x, y:positions[e.from].y, w:fn.w};
            const toR  ={x:positions[e.to].x,   y:positions[e.to].y,   w:tn.w};
            const path = edgePath(fromR,toR,e.kind);
            const isSel = selected===e.from||selected===e.to;
            const color = e.kind==='feedback'?T.red : e.kind==='memory'?T.purple : e.kind==='control'?T.muted : isSel?T.accent:'rgba(255,255,255,0.25)';
            const marker = e.kind==='feedback'?'url(#arr-fb)' : isSel?'url(#arr-sel)':'url(#arr)';
            const sx2=fromR.x+fromR.w, sy2=fromR.y+60, tx2=toR.x, ty2=toR.y+60;
            const mx=(sx2+tx2)/2, my=(sy2+ty2)/2-8;
            return (
              <g key={i}>
                <path d={path} fill="none" stroke={color}
                  strokeWidth={isSel?2:1.25}
                  strokeDasharray={e.kind==='memory'||e.kind==='control'?'4 3':''}
                  markerEnd={marker}/>
                {e.label && (
                  <g transform={`translate(${mx},${my})`}>
                    <rect x={-28} y={-9} width={56} height={16} rx={3} fill={T.bg} stroke={T.border}/>
                    <text textAnchor="middle" y={3} fontSize={10} fill={T.muted} fontFamily={SANS}>{e.label}</text>
                  </g>
                )}
              </g>
            );
          })}
        </svg>

        {workflow.nodes.map(n=>(
          <CanvasNode key={n.id} node={n} pos={positions[n.id]}
            selected={selected===n.id} dragging={drag===n.id}
            onSelect={()=>onSelect(n.id)}
            onPointerDown={e=>onPointerDown(e,n.id)}/>
        ))}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// CONFIG PANEL TABS
// ─────────────────────────────────────────────────────────────────────────────
const ALL_TOOLS = ['web_search','web_fetch','grep','read_file','list_files','fs.write',
  'fs.append','fs.read','bash','classify','vector_search','cite','git','todo_write',
  'subagent_dispatch','test','puppeteer'];

const TOOL_RISK = {'bash':'high','fs.write':'medium','subagent_dispatch':'high','test':'medium',
  'puppeteer':'medium','classify':'low','web_fetch':'low'};

function RoleTab({node}) {
  const meta=ROLE_META[node.kind], model=node.model?MODELS[node.model]:null;
  return (
    <div>
      <Sec title="Identity">
        <Fld label="Display name"><input value={node.label} readOnly style={inputSt}/></Fld>
        <Fld label="Role / kind">
          <select value={node.kind} style={{...inputSt,appearance:'none'}}>
            {Object.entries(ROLE_META).map(([k,m])=><option key={k} value={k}>{m.glyph} {m.label}</option>)}
          </select>
        </Fld>
        <Fld label="Status">
          <select value={node.status} style={{...inputSt,appearance:'none'}}>
            {Object.keys(STATUS).map(s=><option key={s}>{s}</option>)}
          </select>
        </Fld>
      </Sec>
      <Sec title="Model">
        <Fld label="Provider · model">
          <select defaultValue={node.model||''} style={{...inputSt,appearance:'none'}}>
            <option value="">— none —</option>
            {Object.entries(MODELS).map(([k,m])=><option key={k} value={k}>{m.short}</option>)}
          </select>
        </Fld>
        {model && (
          <div style={{background:T.bg,border:`1px solid ${T.border}`,borderRadius:5,
            padding:10,fontSize:11,color:T.muted,display:'grid',
            gridTemplateColumns:'1fr 1fr',gap:'5px 12px',fontFamily:MONO}}>
            <span>context</span><span style={{color:T.text,textAlign:'right'}}>{(model.ctx/1000)|0}k tok</span>
            <span>in / Mtok</span><span style={{color:T.text,textAlign:'right'}}>${model.costIn}</span>
            <span>out / Mtok</span><span style={{color:T.text,textAlign:'right'}}>${model.costOut}</span>
          </div>
        )}
      </Sec>
      <Sec title="Limits">
        <Fld label={`Token budget · ${node.tokens.budget.toLocaleString()}`}>
          <input type="range" min={1000} max={100000} step={1000} defaultValue={node.tokens.budget}
            style={{width:'100%',accentColor:T.accent}}/>
        </Fld>
        <Fld label="Max steps"><input defaultValue={20} style={inputSt}/></Fld>
        <Fld label="Timeout (s)"><input defaultValue={300} style={inputSt}/></Fld>
      </Sec>
    </div>
  );
}

      <Sec title={`Permitted tools · ${node.tools.length} / ${ALL_TOOLS.length}`}>

        <div style={{display:'flex',flexDirection:'column',gap:2}}>

            const on=node.tools.includes(tool);

            return (
              <label key={tool} style={{display:'flex',alignItems:'center',gap:8,
                padding:'5px 6px',borderRadius:4,

                <span style={{fontSize:12,color:on?T.text:T.muted,fontFamily:MONO,flex:1}}>{tool}</span>
                <span style={{fontSize:9,padding:'1px 5px',borderRadius:3,
                  background:`${riskColor}18`,color:riskColor}}>{risk}</span>

        </div>
      </Sec>
    </div>
  );
}

  const barColor = pct>0.8?T.red : pct>0.5?T.accent : T.green;
  return (
    <div>
      <Sec title="Context window">
        <div style={{background:T.bg,border:`1px solid ${T.border}`,borderRadius:5,padding:12}}>
          <div style={{display:'flex',alignItems:'baseline',gap:6,marginBottom:8,fontFamily:MONO}}>
            <span style={{fontSize:22,fontWeight:600,color:T.text}}>
              {(node.tokens.used/1000).toFixed(1)}
            </span>
            <span style={{fontSize:12,color:T.muted}}>
              / {(node.tokens.budget/1000).toFixed(0)}k tokens used
            </span>
          </div>
          <div style={{height:6,background:T.surface3,borderRadius:3,overflow:'hidden',marginBottom:10}}>
            <div style={{height:'100%',width:`${Math.min(100,pct*100)}%`,background:barColor,transition:'width 300ms'}}/>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr auto',gap:'4px 10px',
            fontSize:11,color:T.muted,fontFamily:MONO}}>
            <span>system prompt</span><span style={{color:T.text}}>1,240</span>
            <span>tool defs</span>    <span style={{color:T.text}}>2,180</span>
            <span>conversation</span> <span style={{color:T.text}}>{Math.max(0,node.tokens.used-3420).toLocaleString()}</span>
            <span>free remaining</span><span style={{color:barColor}}>{((node.tokens.budget-node.tokens.used)/1000).toFixed(1)}k</span>
            <span>compaction at</span><span style={{color:T.accent}}>80%</span>
          </div>
        </div>
      </Sec>
      <Sec title="Long-term memory">
        <Fld label="Strategy">
          <select defaultValue="append-jsonl" style={{...inputSt,appearance:'none'}}>
            <option value="append-jsonl">Append-only JSONL</option>
            <option value="vector">Vector store</option>
            <option value="summary">Rolling summary</option>
            <option value="none">None</option>
          </select>
        </Fld>
        <Fld label="Backing path">
          <input defaultValue={`.harness/memory/${node.id}.jsonl`}
            style={{...inputSt,fontFamily:MONO,fontSize:11}}/>
        </Fld>
      </Sec>
    </div>
  );
}

function Sec({title, children, action}) {
  return (
    <div style={{marginBottom:18}}>
      <div style={{display:'flex',alignItems:'center',marginBottom:8}}>
        <span style={{fontSize:10,fontWeight:600,color:T.muted,
          letterSpacing:'0.06em',textTransform:'uppercase'}}>{title}</span>
        {action && <><div style={{flex:1}}/>{action}</>}
      </div>
      {children}
    </div>
  );
}
function Fld({label, children}) {
  return (
    <div style={{marginBottom:10}}>
      <div style={{fontSize:11,color:T.muted,marginBottom:4}}>{label}</div>
      {children}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// CONFIG PANEL
// ─────────────────────────────────────────────────────────────────────────────
const CONFIG_TABS = ['role','prompt','tools','hooks','memory'];
function ConfigPanel({node, tab, setTab}) {
  if (!node) return (
    <div style={{gridArea:'right',background:T.surface,borderLeft:`1px solid ${T.border}`,
      display:'flex',alignItems:'center',justifyContent:'center',color:T.hint,fontSize:12}}>
      Select a node to inspect
    </div>
  );
  const meta = ROLE_META[node.kind];
  return (
    <div style={{gridArea:'right',background:T.surface,borderLeft:`1px solid ${T.border}`,
      display:'flex',flexDirection:'column',overflow:'hidden'}}>
      {/* Header */}
      <div style={{padding:'12px 14px 0',borderBottom:`1px solid ${T.border}`}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
          <div style={{width:28,height:28,borderRadius:7,background:`${meta.tint}22`,
            color:meta.tint,display:'grid',placeItems:'center',flexShrink:0}}>
            <Icon name={meta.icon} size={15}/>
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{node.label}</div>
            <div style={{fontSize:10,color:T.hint,fontFamily:MONO,textTransform:'uppercase',letterSpacing:'0.04em'}}>
              {meta.label} · {node.id}
            </div>
          </div>
          <button title="History" style={{width:26,height:26,border:'none',borderRadius:4,
            background:'transparent',color:T.hint,cursor:'pointer',display:'grid',placeItems:'center'}}>
            <Icon name="history" size={13}/>
          </button>
        </div>
        {/* Tabs */}
        <div style={{display:'flex',padding:'0 -2px'}}>
          {CONFIG_TABS.map(t=>(
            <button key={t} onClick={()=>setTab(t)} style={{
              padding:'7px 10px',border:'none',background:'transparent',fontFamily:SANS,
              color:tab===t?T.text:T.muted,
              borderBottom:tab===t?`2px solid ${T.accent}`:'2px solid transparent',
              marginBottom:-1,fontSize:11,textTransform:'uppercase',letterSpacing:'0.04em',cursor:'pointer',
            }}>{t}</button>
          ))}
        </div>
      </div>
      {/* Body */}
      <div style={{flex:1,overflow:'auto',padding:14}}>
        {tab==='role'   && <RoleTab   node={node}/>}
        {tab==='prompt' && <PromptTab node={node}/>}
        {tab==='tools'  && <ToolsTab  node={node}/>}
        {tab==='hooks'  && <HooksTab  node={node}/>}
        {tab==='memory' && <MemoryTab node={node}/>}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// AUDIT / TRACE STRIP
// ─────────────────────────────────────────────────────────────────────────────
const KIND_COLOR = {
  run:T.accent, tokens:T.muted, edge:T.blue, tool:T.green,
  fanout:T.purple, consent:T.orange, done:T.blue, warn:T.accent, error:T.red,
};
function AuditStrip({open, setOpen}) {
  return (
    <div style={{gridArea:'bottom',background:T.surface,borderTop:`1px solid ${T.border}`,
      display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <div style={{display:'flex',alignItems:'center',padding:'5px 12px',
        borderBottom:open?`1px solid ${T.border}`:'none',gap:10}}>
        <button onClick={()=>setOpen(v=>!v)} style={{
          background:'transparent',border:'none',color:T.muted,cursor:'pointer',
          fontSize:11,display:'inline-flex',alignItems:'center',gap:5,fontFamily:SANS,padding:0}}>
          <Icon name={open?'chev-d':'chev'} size={10}/>
          <span style={{textTransform:'uppercase',letterSpacing:'0.06em',fontWeight:600,color:T.text}}>Audit · Trace</span>
        </button>
        <div style={{display:'flex',gap:3}}>
          {['all','tool','consent','warn'].map((f,i)=>(
            <button key={f} style={{padding:'2px 8px',borderRadius:99,border:'none',
              background:i===0?T.surface3:'transparent',
              color:i===0?T.text:T.muted,fontSize:10,cursor:'pointer',fontFamily:SANS}}>{f}</button>
          ))}
        </div>
        <div style={{flex:1}}/>
        <span style={{fontSize:10,color:T.hint,fontFamily:MONO}}>
          tokens 36.4k · $0.74 · 8.2s
        </span>
      </div>
      {open && (
        <div style={{flex:1,overflow:'auto',padding:'4px 0',fontFamily:MONO,fontSize:11}}>
          {AUDIT_ENTRIES.map((e,i)=>(
            <div key={i} style={{display:'flex',gap:12,padding:'2px 12px'}}>
              <span style={{color:T.hint,minWidth:92,flexShrink:0}}>{e.t}</span>
              <span style={{color:KIND_COLOR[e.kind]||T.muted,minWidth:58,flexShrink:0,
                textTransform:'uppercase',fontSize:10,letterSpacing:'0.04em',paddingTop:1}}>{e.kind}</span>
              <span style={{color:T.muted,minWidth:130,flexShrink:0}}>{e.node}</span>
              <span style={{color:T.text}}>{e.msg}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// PHASE PROGRESS MODAL
// ─────────────────────────────────────────────────────────────────────────────
function PhaseModal({onClose}) {
  return (
    <Modal title="Phase Progress" onClose={onClose} width={560}>
      <div style={{display:'flex',flexDirection:'column',gap:6}}>
        {PHASES.map(p=>(
          <div key={p.n} style={{
            display:'flex',alignItems:'flex-start',gap:12,padding:'10px 12px',
            borderRadius:6,border:`1px solid ${
              p.state==='done'?'rgba(95,191,127,0.28)' :
              p.state==='current'?T.accent :
              T.border}`,
            background:
              p.state==='done'?'rgba(95,191,127,0.05)' :
              p.state==='current'?T.accentSoft : 'transparent',
            opacity: p.state===''?0.45:1,
          }}>
            <div style={{width:24,height:24,borderRadius:'50%',flexShrink:0,
              background:p.state==='done'?T.green : p.state==='current'?T.accent : T.surface3,
              color:p.state==='done'||p.state==='current'?'#0e0f13':T.muted,
              display:'grid',placeItems:'center',fontSize:11,fontWeight:700}}>
              {p.state==='done'?'✓':p.n}
            </div>
            <div style={{flex:1}}>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <span style={{fontSize:13,fontWeight:600,color:T.text}}>
                  Phase {p.n}: {p.name}
                </span>
                {p.state==='current' && (
                  <span style={{fontSize:9,padding:'2px 7px',borderRadius:99,
                    background:T.accentSoft,color:T.accent,fontWeight:700}}>CURRENT</span>
                )}
                {p.state==='next' && (
                  <span style={{fontSize:9,padding:'2px 7px',borderRadius:99,
                    background:T.surface3,color:T.muted,fontWeight:600}}>NEXT</span>
                )}
              </div>
              <div style={{fontSize:11,color:T.muted,marginTop:2}}>{p.desc}</div>
            </div>
          </div>
        ))}
      </div>
    </Modal>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// REVIEW CHECKLIST MODAL
// ─────────────────────────────────────────────────────────────────────────────
function ChecklistModal({onClose}) {
  const allPass = CHECKLIST.every(([,s])=>s==='pass');
  return (
    <Modal title="Phase 1 Review Checklist" onClose={onClose} width={520}>
      <div style={{marginBottom:12,fontSize:12,color:T.muted}}>
        All items must pass before moving to Phase 2 implementation.
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:4}}>
        {CHECKLIST.map(([label,state],i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'6px 8px',
            borderRadius:5,
            background:state==='pass'?'rgba(95,191,127,0.06)':'rgba(239,68,68,0.06)',
            border:`1px solid ${state==='pass'?'rgba(95,191,127,0.2)':'rgba(239,68,68,0.2)'}`}}>
            <span style={{width:18,height:18,borderRadius:'50%',flexShrink:0,
              background:state==='pass'?T.green:T.red,
              display:'grid',placeItems:'center',color:'#0e0f13'}}>
              <Icon name={state==='pass'?'check':'x'} size={11} stroke={2.5}/>
            </span>
            <span style={{fontSize:12,color:state==='pass'?T.text:T.red}}>{label}</span>
          </div>
        ))}
      </div>
      {allPass && (
        <div style={{marginTop:14,padding:'10px 14px',
          background:'rgba(95,191,127,0.08)',border:'1px solid rgba(95,191,127,0.3)',
          borderRadius:6,fontSize:12,color:T.green,display:'flex',gap:8,alignItems:'center'}}>
          <Icon name="check" size={14}/> Phase 1 complete. Ready for human review. Do not start Phase 2 without sign-off.
        </div>
      )}
    </Modal>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// SHARED MODAL WRAPPER
// ─────────────────────────────────────────────────────────────────────────────
function Modal({title, children, onClose, width=480}) {
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.55)',
      backdropFilter:'blur(3px)',display:'flex',alignItems:'flex-start',
      justifyContent:'center',paddingTop:60,zIndex:100,fontFamily:SANS}}
      onClick={onClose}>
      <div style={{width,background:T.surface2,border:`1px solid ${T.borderStrong}`,
        borderRadius:12,boxShadow:'0 24px 80px rgba(0,0,0,0.6)',overflow:'hidden',
        animation:'slide-up 180ms ease',maxHeight:'80vh',display:'flex',flexDirection:'column'}}
        onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',alignItems:'center',padding:'14px 18px',
          borderBottom:`1px solid ${T.border}`}}>
          <span style={{fontSize:14,fontWeight:600,color:T.text}}>{title}</span>
          <div style={{flex:1}}/>
          <button onClick={onClose} style={{width:26,height:26,border:'none',borderRadius:5,
            background:'transparent',color:T.muted,cursor:'pointer',display:'grid',placeItems:'center'}}>
            <Icon name="x" size={14}/>
          </button>
        </div>
        <div style={{padding:18,overflow:'auto'}}>{children}</div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// TOP BAR
// ─────────────────────────────────────────────────────────────────────────────
function TopBar({wfKey, setWfKey, workflow, onPhases, onChecklist}) {
  return (
    <div style={{gridArea:'top',display:'flex',alignItems:'center',
      padding:'0 14px',gap:10,background:T.surface,borderBottom:`1px solid ${T.border}`}}>
      {/* Logo */}
      <div style={{width:18,height:18,borderRadius:4,background:T.accent,
        display:'grid',placeItems:'center',color:'#1a1207',fontSize:10,fontWeight:800}}>H</div>
      <span style={{fontSize:12,color:T.muted}}>harness-studio</span>
      <span style={{color:T.hint,fontSize:12}}>/</span>
      <span style={{fontSize:12,fontWeight:500,color:T.text}}>{workflow.name}</span>
      {/* Unsaved indicator */}
      <span style={{fontSize:10,color:T.accent}}>● unsaved</span>
      {/* Phase badge */}
      <div style={{marginLeft:4,padding:'2px 10px',borderRadius:99,fontSize:10,fontWeight:700,
        background:T.accentSoft,color:T.accent,border:`1px solid ${T.accent}`,letterSpacing:'0.03em'}}>
        Phase 1 · HTML Prototype
      </div>

      <div style={{flex:1}}/>

      {/* Workflow selector */}
      <div style={{display:'flex',alignItems:'center',gap:6,fontSize:11,color:T.muted}}>
        <span>Pattern:</span>
        <select value={wfKey} onChange={e=>setWfKey(e.target.value)}
          style={{background:T.surface3,border:`1px solid ${T.border}`,borderRadius:4,
            color:T.text,fontSize:11,padding:'2px 6px',fontFamily:SANS,outline:'none',cursor:'pointer'}}>
          <option value="fanout">Parallel fan-out</option>
          <option value="pipeline">Sequential pipeline</option>
          <option value="critic">Critic loop</option>
        </select>
      </div>

      <div style={{width:1,height:18,background:T.border}}/>

      {/* Stats */}
      <div style={{display:'flex',alignItems:'center',gap:8,fontSize:11,color:T.muted}}>
        <Icon name="undo" size={13}/><Icon name="redo" size={13}/>
        <div style={{width:1,height:14,background:T.border,margin:'0 2px'}}/>
        <span><b style={{color:T.text}}>{workflow.nodes.length}</b> nodes</span>
        <span><b style={{color:T.text}}>{workflow.edges.length}</b> edges</span>
        <span style={{color:T.green}}>● valid</span>
        <div style={{width:1,height:14,background:T.border,margin:'0 2px'}}/>
      </div>

      {/* Actions */}
      <Btn small onClick={onPhases}>📊 Phases</Btn>
      <Btn small onClick={onChecklist}>✅ Review</Btn>
      <div style={{width:1,height:18,background:T.border}}/>
      <Btn small><Icon name="check" size={11}/> Validate</Btn>
      <Btn small><Icon name="save" size={11}/> Save</Btn>
      <Btn small primary><Icon name="play" size={11}/> Run</Btn>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// SIDEBAR — file tree + node list
// ─────────────────────────────────────────────────────────────────────────────
function Sidebar({workflow, selected, onSelect}) {
  return (
    <div style={{gridArea:'left',background:T.surface,borderRight:`1px solid ${T.border}`,
      display:'flex',flexDirection:'column',overflow:'hidden'}}>
      {/* Workspace header */}
      <div style={{padding:'12px 12px 8px',display:'flex',alignItems:'center',justifyContent:'space-between',
        borderBottom:`1px solid ${T.border}`}}>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          <Icon name="folder" size={13} color={T.accent}/>
          <span style={{fontSize:12,fontWeight:500}}>research-agent</span>
        </div>
        <Icon name="cog" size={12} style={{color:T.hint,cursor:'pointer'}}/>
      </div>
      {/* Search */}
      <div style={{padding:'8px 10px',borderBottom:`1px solid ${T.border}`}}>
        <div style={{display:'flex',alignItems:'center',gap:5,background:T.bg,
          border:`1px solid ${T.border}`,borderRadius:4,padding:'4px 7px'}}>
          <Icon name="search" size={11} style={{color:T.hint}}/>
          <input placeholder="search files" style={{flex:1,background:'transparent',border:'none',
            color:T.text,fontSize:11,outline:'none',fontFamily:SANS}}/>
        </div>
      </div>
      {/* File tree label */}
      <div style={{padding:'6px 12px 2px'}}>
        <span style={{fontSize:9,fontWeight:600,color:T.hint,textTransform:'uppercase',letterSpacing:'0.06em'}}>
          Workspace files
        </span>
      </div>
      <FileTree/>
      {/* Nodes section */}
      <div style={{borderTop:`1px solid ${T.border}`,padding:'8px 0'}}>
        <div style={{padding:'0 12px 5px'}}>
          <span style={{fontSize:9,fontWeight:600,color:T.hint,textTransform:'uppercase',letterSpacing:'0.06em'}}>
            Workflow nodes
          </span>
        </div>
        {workflow.nodes.map(n=>{
          const meta=ROLE_META[n.kind];
          const st=STATUS[n.status]||STATUS.idle;
          return (
            <div key={n.id} onClick={()=>onSelect(n.id)} style={{
              display:'flex',alignItems:'center',gap:7,padding:'4px 12px',cursor:'pointer',
              background:selected===n.id?T.accentSoft:'transparent',
              borderLeft:selected===n.id?`2px solid ${T.accent}`:'2px solid transparent',
            }}>
              <span style={{color:meta.tint,fontSize:13,width:14,textAlign:'center'}}>{meta.glyph}</span>
              <span style={{fontSize:12,color:selected===n.id?T.text:T.muted,flex:1,
                overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{n.label}</span>
              <span style={{width:6,height:6,borderRadius:'50%',background:st.dot,flexShrink:0,
                boxShadow:n.status==='running'?`0 0 5px ${st.dot}`:'none'}}/>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// ROOT APP
// ─────────────────────────────────────────────────────────────────────────────
function App() {
  const [wfKey, setWfKey]       = React.useState('fanout');
  const [selected, setSelected] = React.useState('w1');
  const [tab, setTab]           = React.useState('prompt');
  const [auditOpen, setAudit]   = React.useState(true);
  const [modal, setModal]       = React.useState(null); // 'phases' | 'checklist'

  const workflow = WORKFLOWS[wfKey];
  const nodeById = Object.fromEntries(workflow.nodes.map(n=>[n.id,n]));

  React.useEffect(()=>{
    const first = workflow.nodes.find(n=>n.status==='running') || workflow.nodes[0];
    setSelected(first?.id);
  },[wfKey]);

  const selectedNode = nodeById[selected];

  return (
    <div style={{
      width:'100vw',height:'100vh',
      display:'grid',
      gridTemplateRows:'40px 1fr '+(auditOpen?'180px':'28px'),
      gridTemplateColumns:'224px 1fr 320px',
      gridTemplateAreas:`"top top top" "left center right" "bottom bottom bottom"`,
      background:T.bg,color:T.text,fontFamily:SANS,fontSize:13,overflow:'hidden',
    }}>
      <TopBar
        wfKey={wfKey} setWfKey={setWfKey} workflow={workflow}
        onPhases={()=>setModal('phases')}
        onChecklist={()=>setModal('checklist')}/>
      <Sidebar workflow={workflow} selected={selected} onSelect={setSelected}/>
      <div style={{gridArea:'center',display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <Canvas workflow={workflow} selected={selected} onSelect={setSelected}/>
      </div>
      <ConfigPanel node={selectedNode} tab={tab} setTab={setTab}/>
      <AuditStrip open={auditOpen} setOpen={setAudit}/>

      {modal==='phases'    && <PhaseModal    onClose={()=>setModal(null)}/>}
      {modal==='checklist' && <ChecklistModal onClose={()=>setModal(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
